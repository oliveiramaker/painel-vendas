<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecomfy — Minha conta</title><link rel="icon" href="favicon.svg"><script src="theme.js"></script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body class="bg-zinc-950 text-white"><header class="sticky top-0 z-50 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800"><div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center"><a href="app.html" class="flex items-center gap-3"><span class="brand-mark"><i class="fa-solid fa-calculator"></i></span><b class="text-2xl">Ecomfy</b></a><div class="flex gap-2"><a href="app.html" class="h-10 px-4 rounded-xl border border-zinc-700 bg-zinc-800 flex items-center gap-2 text-sm">Painel</a><button data-theme-toggle class="theme-toggle-btn w-10 h-10 rounded-xl border border-zinc-700 bg-zinc-800"><i class="fa-solid fa-sun icon-sun text-amber-400"></i><i class="fa-solid fa-moon icon-moon text-blue-300"></i></button></div></div></header><main class="max-w-3xl mx-auto px-4 sm:px-6 py-12"><span class="eyebrow">Conta</span><h1 class="text-4xl font-black mt-2">Minha conta</h1><p class="text-zinc-400 mt-3">Gerencie seus dados de acesso ao Ecomfy.</p><div id="account-status" class="mt-6 hidden rounded-xl p-4"></div><section class="tool-panel mt-8"><h2 class="text-xl font-bold">Dados pessoais</h2><form id="profile-form" class="mt-6 space-y-5"><div><label class="block text-sm font-semibold mb-2">Nome</label><input id="full-name" class="form-input" required></div><div><label class="block text-sm font-semibold mb-2">E-mail</label><input id="email" class="form-input" type="email" disabled></div><button class="primary-cta" type="submit">Salvar alterações</button></form></section><section class="tool-panel mt-5"><h2 class="text-xl font-bold">Segurança</h2><form id="password-form" class="mt-6 space-y-5"><div><label class="block text-sm font-semibold mb-2">Nova senha</label><input id="new-password" class="form-input" type="password" minlength="8" placeholder="Mínimo de 8 caracteres"></div><div><label class="block text-sm font-semibold mb-2">Confirmar nova senha</label><input id="new-password-confirm" class="form-input" type="password" minlength="8"></div><button class="secondary-cta" type="submit">Alterar senha</button></form></section><section class="tool-panel mt-5 border-red-500/20"><h2 class="text-xl font-bold">Sessão</h2><p class="text-zinc-400 mt-2">Saia desta conta neste dispositivo.</p><button id="logout" class="mt-5 h-11 px-5 rounded-xl border border-red-500/30 text-red-400 hover:bg-red-500/10 font-semibold">Sair da conta</button></section></main><script src="auth.js"></script><script>(async()=>{const ready=()=>{const c=window.ecomfySupabase;if(!c)return; c.auth.getUser().then(async({data:{user}})=>{if(!user)return;document.getElementById('email').value=user.email||'';document.getElementById('full-name').value=user.user_metadata?.full_name||user.user_metadata?.name||'';});document.getElementById('profile-form').addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('full-name').value.trim();const {error}=await c.auth.updateUser({data:{full_name:name}});const s=document.getElementById('account-status');s.className='mt-6 rounded-xl p-4 bg-emerald-500/10 text-emerald-400';s.textContent=error?error.message:'Dados atualizados com sucesso.';s.classList.remove('hidden');});document.getElementById('password-form').addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('new-password').value,b=document.getElementById('new-password-confirm').value,s=document.getElementById('account-status');if(a.length<8||a!==b){s.className='mt-6 rounded-xl p-4 bg-red-500/10 text-red-400';s.textContent=a!==b?'As senhas não coincidem.':'A senha precisa ter pelo menos 8 caracteres.';s.classList.remove('hidden');return;}const {error}=await c.auth.updateUser({password:a});s.className=`mt-6 rounded-xl p-4 ${error?'bg-red-500/10 text-red-400':'bg-emerald-500/10 text-emerald-400'}`;s.textContent=error?error.message:'Senha alterada com sucesso.';s.classList.remove('hidden');e.target.reset();});document.getElementById('logout').addEventListener('click',async()=>{await c.auth.signOut();location.href='auth.html';});};if(window.ecomfySupabase)ready();else window.addEventListener('ecomfy-auth-ready',ready);})();</script></body></html>
