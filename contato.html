<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Cartão digital de contato de Matheus Santos de Oliveira." />
  <title>Matheus Santos de Oliveira | Contato</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  
  <style>
    :root {
      --bg-1: #070b16;
      --bg-2: #10172c;
      --text: #f7f9ff;
      --muted: #aeb8cf;
      --glass: rgba(255, 255, 255, 0.09);
      --glass-strong: rgba(255, 255, 255, 0.13);
      --border: rgba(255, 255, 255, 0.18);
      --accent: #8b7cff;
      --accent-2: #4bd6ff;
      --success: #32d583;
      --shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(139, 124, 255, 0.24), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(75, 214, 255, 0.18), transparent 28%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      filter: blur(10px);
      pointer-events: none;
    }

    body::before {
      width: 330px;
      height: 330px;
      top: -100px;
      right: -80px;
      background: rgba(133, 99, 255, 0.17);
      animation: float 8s ease-in-out infinite;
    }

    body::after {
      width: 280px;
      height: 280px;
      left: -90px;
      bottom: -80px;
      background: rgba(0, 204, 255, 0.12);
      animation: float 10s ease-in-out infinite reverse;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    .card {
      width: min(100%, 560px);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.12),
        rgba(255, 255, 255, 0.055)
      );
      backdrop-filter: blur(22px) saturate(125%);
      -webkit-backdrop-filter: blur(22px) saturate(125%);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 34px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(255,255,255,0.08),
        transparent 30%,
        transparent 70%,
        rgba(255,255,255,0.04)
      );
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 26px;
    }

    .avatar {
      width: 82px;
      height: 82px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background:
        linear-gradient(135deg, rgba(139, 124, 255, 0.95), rgba(75, 214, 255, 0.82));
      box-shadow:
        0 12px 28px rgba(75, 214, 255, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.34);
    }

    .eyebrow {
      color: #d7dcf0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: clamp(27px, 5vw, 38px);
      line-height: 1.08;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      margin: 20px 0;
    }

    .contacts {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 13px;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.045);
      border-radius: 18px;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .contact:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.075);
      border-color: rgba(255,255,255,0.21);
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .contact-main {
      min-width: 0;
      flex: 1;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .value {
      display: block;
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    button,
    a.btn {
      border: 0;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    .mini-btn {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      color: #fff;
      background: rgba(255,255,255,0.07);
      transition: all 0.2s ease;
    }

    .mini-btn:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-1px);
    }

    .primary-actions {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    .btn {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      border-radius: 16px;
      color: #fff;
      font-weight: 800;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #19b874, #28d17f);
      box-shadow: 0 12px 24px rgba(40, 209, 127, 0.18);
    }

    .btn-email {
      background: linear-gradient(135deg, #6257ef, #8a78ff);
      box-shadow: 0 12px 24px rgba(122, 101, 255, 0.18);
    }

    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
      color: #8993aa;
      font-size: 12px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 12px rgba(50, 213, 131, 0.75);
    }

    .copy-toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 16px;
      border-radius: 12px;
      color: white;
      background: rgba(18, 23, 39, 0.88);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(14px);
      transition: all 0.25s ease;
      font-size: 13px;
      font-weight: 700;
    }

    .copy-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(0, 18px, 0) scale(1.04); }
    }

    @media (max-width: 520px) {
      .page {
        padding: 14px;
      }

      .card {
        border-radius: 24px;
        padding: 22px;
      }

      .top {
        align-items: flex-start;
      }

      .avatar {
        width: 70px;
        height: 70px;
        border-radius: 20px;
        font-size: 23px;
      }

      h1 {
        font-size: 27px;
      }

      .primary-actions {
        grid-template-columns: 1fr;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="copy-toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const input = document.createElement("textarea");
        input.value = text;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }

      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }
  </script>
